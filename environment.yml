name: audiomorphix
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - ffmpeg<7
  - pip
  - pip:
      - numpy<2
      - diffusers==0.18.2
      - xformers==0.0.21
      - transformers==4.30.1
      - einops
      - pytorch_lightning
      - omegaconf
      - spaces
      - gradio
      - huggingface-hub==0.25.1
      - librosa
      - opencv-python
      - progressbar
      - wandb
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchaudio==2.0.2+cu118
      - torchvision==0.15.2+cu118
